[build]
  publish = "."

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[redirects]]
  from = "/.netlify/results.md"
  to = "/404.html"
  status = 404

[[redirects]]
  from = "/README.md"
  to = "/404.html"
  status = 404
